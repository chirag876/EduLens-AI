services:
  redis:
    image: redis:7-alpine
    container_name: edulens_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: edulens_celery_worker
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
      - ./temp_videos:/app/temp_videos
    working_dir: /app
    restart: unless-stopped